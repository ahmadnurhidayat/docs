# ============================================================================
# External Gateway — public WebSocket (WSS) entry point for mobile chat clients
# GatewayClass: gke-l7-global-external-managed (GKE L7 Global External LB)
# Owner: Platform team
# ============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: prod-external-gw
  namespace: gateway-api
  labels:
    app.kubernetes.io/part-of: chat-platform
    gateway.scope: external
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    # HTTP :80 — redirect-only (handled by an HTTPRoute with a RequestRedirect filter)
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    # HTTPS :443 — WSS terminates here; TLS from a Google-managed/uploaded cert
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.example.com"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: example-com-wildcard-tls
      allowedRoutes:
        namespaces:
          # Let app teams attach routes from labeled namespaces only
          from: Selector
          selector:
            matchLabels:
              gateway-access: "external"
        kinds:
          - kind: HTTPRoute
---
# Redirect plain HTTP to HTTPS so WSS clients always upgrade over TLS
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: gateway-api
spec:
  parentRefs:
    - name: prod-external-gw
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
