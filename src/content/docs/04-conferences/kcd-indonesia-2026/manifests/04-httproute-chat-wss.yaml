# ============================================================================
# Chat WSS route + GKE-native policies for long-lived WebSocket connections
#   - HTTPRoute       : wss-chat-prod.example.com -> emqx-chat :8083
#   - GCPBackendPolicy : 120s timeout + connection draining for WSS
#   - HealthCheckPolicy: probe EMQX status endpoint
# Owner: App team (route) + Platform defaults (policies)
# ============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat-wss
  namespace: infrastructure
  labels:
    gateway-access: external
spec:
  parentRefs:
    - name: prod-external-gw
      namespace: gateway-api
      sectionName: https
  hostnames:
    - "wss-chat-prod.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mqtt            # EMQX WebSocket path
      backendRefs:
        - name: emqx-chat
          port: 8083
---
# Keep the LB from cutting idle WebSockets; drain gracefully on rollout.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: emqx-chat-backend
  namespace: infrastructure
spec:
  targetRef:
    group: ""
    kind: Service
    name: emqx-chat
  default:
    timeoutSec: 120                 # long-lived WebSocket
    connectionDraining:
      drainingTimeoutSec: 60
    logging:
      enabled: true
      sampleRate: 500000            # 50% sampling (ppm)
---
# Health check so the LB only sends traffic to healthy EMQX nodes.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: emqx-chat-health
  namespace: infrastructure
spec:
  targetRef:
    group: ""
    kind: Service
    name: emqx-chat
  default:
    config:
      type: HTTP
      httpHealthCheck:
        port: 18083
        requestPath: /api/v5/status
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
